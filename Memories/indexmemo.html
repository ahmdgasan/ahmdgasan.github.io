    body {

    h2 {

    }
    .back-link {
      display: inline-block;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }
    .back-link:hover {
      color: #007bff;
    }
    .album-title {
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0 10px;
    }
    .album-count {
      font-size: 14px;
      color: #888;
      margin-bottom: 10px;
    }
    .photo-gallery-grid figure {
      margin: 0;
    }
    .video-thumb {
      position: relative;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }
    .video-thumb:hover {
      transform: scale(1.05);
    }
    .video-thumb video {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      background-color: #000;
    }
    .video-thumb .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      padding-left: 3px;
      box-sizing: border-box;
      pointer-events: none;
      transition: color 0.3s ease;
    }
    .video-thumb:hover .play-icon {
      color: #007bff;
    }
    .img-modal-content {
      flex-direction: column;
    }
    .img-modal-content video {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      background-color: #000;
    }
    .img-modal-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      color: #333;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 2001;
    }
    .img-modal-nav:hover {
      color: #007bff;
    }
    .img-modal-prev { left: 20px; }
    .img-modal-next { right: 20px; }
    .social-icons {
      margin: 40px 0 20px;
      text-align: center;
    }
    .social-icons a {
      margin: 0 15px;
      font-size: 24px;
      color: #555;
      text-decoration: none;
    }
    footer {
      text-align: center;
      font-size: 14px;
      color: #888;
      padding-bottom: 20px;
    }
    .intro-screen {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #f9f9f9;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .intro-title {
      font-size: 32px;
      font-weight: bold;
      color: #333;
    }
    .intro-button {
      padding: 10px 24px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      background-color: transparent;
      border: 2px solid #333;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .intro-button:hover {
      color: #007bff;
      border-color: #007bff;
      background-color: #f0f8ff;
    }
    @media (max-width: 480px) {
      .img-modal-prev { left: 8px; }
      .img-modal-next { right: 8px; }
    }
  </style>
</head>

<script>
  function toggleMenu() {
    const menu = document.getElementById("side-menu");
    menu.classList.toggle("active");
  }

  (function() {
    const items = Array.from(document.querySelectorAll('.album-item'));
    const modal = document.getElementById('img-modal');
    const modalImg = document.getElementById('imgModalImg');
    const modalVideo = document.getElementById('imgModalVideo');
    let current = 0;

    const photoCount = items.filter(el => el.tagName === 'IMG').length;
    const videoCount = items.length - photoCount;
    const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
    document.getElementById('albumCount').textContent = plural(photoCount, 'photo') + ' · ' + plural(videoCount, 'video');

    function show(idx) {
      current = (idx + items.length) % items.length;
      const item = items[current];
      modalVideo.pause();

      if (item.tagName === 'IMG') {
        modalVideo.removeAttribute('src');
        modalVideo.style.display = 'none';
        modalImg.style.display = '';
        modalImg.src = item.src;
        modalImg.alt = item.alt;
      } else {
        modalImg.src = '';
        modalImg.style.display = 'none';
        modalVideo.style.display = '';
        modalVideo.src = item.dataset.src;
        modalVideo.play().catch(() => {});
      }
    }

    function openModal(idx) {
      show(idx);
      modal.setAttribute('aria-hidden', 'false');
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      modalImg.src = '';
      modalVideo.pause();
      modalVideo.removeAttribute('src');
      document.body.style.overflow = '';
    }

    items.forEach((item, idx) => {
      if (item.tagName === 'IMG') item.style.cursor = 'zoom-in';
      item.addEventListener('click', () => openModal(idx));
    });

    document.getElementById('imgModalClose').addEventListener('click', closeModal);
    document.getElementById('imgModalPrev').addEventListener('click', () => show(current - 1));
    document.getElementById('imgModalNext').addEventListener('click', () => show(current + 1));

    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', function(e) {
      if (!modal.classList.contains('open')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });
  })();

  (function() {
    const bgMusic = document.getElementById('bgMusic');
    bgMusic.volume = 0.5;

    const navEntry = performance.getEntriesByType('navigation')[0];
    if (navEntry && navEntry.type === 'reload') {
      try {
        const savedTime = parseFloat(sessionStorage.getItem('albumMusicTime'));
        if (savedTime > 0) {
          bgMusic.currentTime = savedTime;
          bgMusic.addEventListener('loadedmetadata', () => {
            if (bgMusic.currentTime < savedTime) bgMusic.currentTime = savedTime;
          }, { once: true });
        }
      } catch (e) {}
    }
    window.addEventListener('pagehide', () => {
      try { sessionStorage.setItem('albumMusicTime', bgMusic.ended ? 0 : bgMusic.currentTime); } catch (e) {}
    });
    const intro = document.getElementById('introScreen');
    const unlockEvents = ['pointerdown', 'keydown', 'touchend'];
    let finished = false;

    function playMusic() {
      if (finished) return;
      bgMusic.play().catch(() => {});
    }

    bgMusic.addEventListener('ended', () => { finished = true; });

    const modalVideo = document.getElementById('imgModalVideo');
    let started = false;
    bgMusic.addEventListener('playing', () => { started = true; });

    function resumeMusic() {
      if (!started || finished || !bgMusic.paused) return;
      if (!modalVideo.paused) return;
      bgMusic.play().catch(() => {});
    }

    bgMusic.addEventListener('pause', () => setTimeout(resumeMusic, 300));
    modalVideo.addEventListener('pause', resumeMusic);
    modalVideo.addEventListener('ended', resumeMusic);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resumeMusic();
    });

    if (intro) {
      bgMusic.pause();
      document.getElementById('introButton').addEventListener('click', () => {
        playMusic();
        intro.classList.add('hidden');
        document.body.style.overflow = '';
        try { sessionStorage.setItem('albumOpened', '1'); } catch (e) {}
        setTimeout(() => intro.remove(), 600);
      });
      return;
    }

    function unlock() {
      playMusic();
    }
    unlockEvents.forEach(ev => document.addEventListener(ev, unlock));
    bgMusic.addEventListener('playing', () => {
      unlockEvents.forEach(ev => document.removeEventListener(ev, unlock));
    });
    playMusic();
  })();
</script>
